name: Windows app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[build]"
      - run: python packaging/make_icon.py
      - run: pyinstaller --noconfirm --clean packaging/vixl_sandbox.spec
      - name: Self-test the executable
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "sandbox-home"
          $report = Join-Path $env:RUNNER_TEMP "self-test.txt"
          $process = Start-Process -FilePath dist\VixlSandbox.exe -ArgumentList "--home", $home_dir, "--self-test", $report -Wait -PassThru
          Get-Content $report
          if ($process.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path $report -Pattern "^ok ")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: VixlSandbox-windows
          path: dist/VixlSandbox.exe
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VixlSandbox.exe
